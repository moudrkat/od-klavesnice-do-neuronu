<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Od klávesnice do neuronu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<!--
  Vibecoding & AI Engineering Festival II — Ostrava, 26. 11. 2026, 15:20–15:50. Web deck (HTML/SVG), soběstačný.
  Ovládání: →/mezerník další krok, ← zpět, F fullscreen. Žádné klikání — vše se posouvá slidy (GIF-able).
  Jeden model-obrázek (modelSVG) se opakuje všude; červená značka ukazuje, KDE přesně je hlava/neuron.
  Vše na slidech = skutečný výstup Qwen2.5-Coder-1.5B na JEDNÉ úloze (get_completed_tasks). Cesta promptu: text → nalepené
  instrukce → tokeny → čísla → 28 vrstev → kód. Message: vibecoding je vrstva na vrstvě, a dovnitř se dá vidět.
-->
<style>
:root{--paper:#faf7ef;--ink:#1e2c5c;--dim:#6a665c;--line:#c9c3b2;--steer:#039080;--over:#be1e1e;--you:#1450af;--other:#c0892b;--attn:#8257d6;--box:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
#deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(135% 115% at 50% -12%, #fffdf8 0%, var(--paper) 58%, #f1ece0 100%);padding:3.5vh 6vw;text-align:center;gap:1.8vh}
.slide.on{display:flex}
h1{font-size:4vw;margin:0;line-height:1.1}
h2{font-size:2.3vw;font-weight:600;margin:0;color:var(--dim)}
.msg{font-size:2.2vw;max-width:84vw;line-height:1.3;margin:0}
.msg b{color:var(--ink)} .msg .r{color:var(--ink)} .msg .y{color:var(--you)}
.sub{font-size:1.25vw;color:var(--dim);margin:0;max-width:82vw}
.layer{font-size:1.4vw;color:var(--dim);letter-spacing:.35em;text-transform:uppercase}
.big{font-size:2.5vw;font-weight:700;margin:0;display:inline-block;padding-bottom:.35vh;border-bottom:.35vh solid color-mix(in srgb, var(--steer) 55%, transparent)}.big::before{content:"▸ ";color:var(--steer)}
.frag{opacity:0;transition:opacity .35s}.frag.show{opacity:1}
body.blank::after{content:"";position:fixed;inset:0;background:#000;z-index:9999}
.row{display:flex;gap:3vw;align-items:center;justify-content:center;flex-wrap:wrap;max-width:90vw}
.col{display:flex;flex-direction:column;gap:1vh;align-items:center}
.win{border:1px solid #ddd7c7;background:var(--box);border-radius:14px;text-align:left;font-family:ui-monospace,monospace;font-size:1.3vw;line-height:1.5;padding:.9em 1.1em;box-shadow:0 10px 34px rgba(30,44,92,.10);max-width:42vw;white-space:pre-wrap}
.win .tt{color:var(--dim);font-size:.82em;border-bottom:1px solid var(--line);margin:-.3em -.3em .5em;padding:.2em .4em;white-space:normal}
.win .you{color:var(--you)} .win .hl{background:#fff2a8;color:var(--ink);font-weight:700;border-radius:3px} .win .glue{background:color-mix(in srgb, var(--other) 28%, transparent);color:var(--ink);font-weight:700;border-radius:3px} .win .bug{color:var(--over);font-weight:700;text-decoration:underline wavy var(--over);text-underline-offset:.2em} .win .bad{color:var(--dim);font-weight:700;text-decoration:underline wavy var(--dim)} .win .d{color:var(--dim)}
.note{border:1.5px solid rgba(20,80,175,.45);background:rgba(20,80,175,.055);color:var(--you);border-radius:14px;padding:.55em .9em;font-size:1.3vw;font-family:ui-monospace,monospace;text-align:left;box-shadow:0 8px 26px rgba(20,80,175,.08)}
.note .who{color:var(--dim);font-size:.72em;display:block}
.num{font-size:3.2vw;font-weight:800}.num.g{color:var(--ink)}.num.r{color:var(--ink)}
table{border-collapse:collapse;font-size:1.6vw}td,th{padding:.3em 1.1em;text-align:center}th{color:var(--dim);font-weight:600}
.cap{font-size:1.7vw;max-width:76vw;margin:0}.cap b{color:var(--ink)}.cap .r{color:var(--ink)}
.seq{display:none;flex-direction:column;align-items:center;gap:1.6vh;width:100%}
.seq.on{display:flex}
#pg{position:fixed;right:1.2vw;bottom:1vh;color:#999;font-size:1vw;z-index:10;font-family:ui-monospace,monospace}
svg .body{stroke:var(--ink);stroke-width:10;fill:var(--paper)} svg .win2{stroke:var(--ink);stroke-width:5;fill:var(--paper)}
svg .spine{stroke:var(--steer);stroke-width:10;fill:none;stroke-linecap:round} svg .eye{fill:var(--ink)}
svg .fl{stroke:var(--ink);stroke-width:8.5;fill:none;stroke-linecap:round} svg .floor{stroke:var(--line);stroke-width:1}
svg.m-ours .body{stroke-width:13} svg.m-ours .fl{stroke-width:9.5} svg.m-ours .win2{stroke-width:6.5}
svg.m-senior .body{stroke-width:6;fill:#e9e4d6;stroke:var(--dim)} svg.m-senior .win2{stroke:var(--dim);fill:#f4f1e8} svg.m-senior .eye{fill:var(--dim)} svg.m-senior .fl{stroke-width:6;stroke:var(--dim)}
svg.m-frontier .body{stroke:var(--other);stroke-width:8} svg.m-frontier .win2{stroke:var(--other)} svg.m-frontier .fl{stroke:var(--other)} svg.m-frontier .eye{fill:var(--other)} svg.m-frontier .crown{filter:drop-shadow(0 2px 3px rgba(192,137,43,.4))}
.cite{position:absolute;right:1.6vw;bottom:12.5vh;font-size:.78vw;color:var(--dim);text-align:right;line-height:1.45;max-width:34vw;z-index:4}.cite a{color:var(--you);text-decoration:none}.hlod{font-family:"Caveat","Segoe Print","Comic Sans MS",cursive;font-weight:700;color:var(--steer);font-size:3vw;line-height:1.15;margin-top:1.2vh}.morph:has(.frag.show) .comic{opacity:0}.why{font-size:1.15vw;color:var(--ink);text-align:left;line-height:1.35;margin:.2vh 0 0 .3vw}.why::before{content:"↳ ";color:var(--steer);font-weight:700}.why b{color:var(--steer)}.why .x{color:var(--over);font-weight:700}
.tb{position:relative;background:#1a1b26;color:#c0caf5;border-radius:12px;padding:.6em .9em;font-family:ui-monospace,Menlo,monospace;font-size:1vw;line-height:1.45;text-align:left;white-space:pre-wrap;box-shadow:0 8px 26px rgba(0,0,0,.18);max-width:70vw}
.tb::before{content:"";position:absolute;left:-10px;top:38%;border:8px solid transparent;border-right-color:#1a1b26;border-left:0}
.tb .r{color:#7dcfff}.tb .ok{color:#9ece6a;font-weight:700}.tb .bad{color:#f7768e;font-weight:700}.tb .g{color:#787c99}
.slide:has(.pfoot){padding-bottom:8vh}.pfoot{position:absolute;left:4vw;right:4vw;bottom:1.1vh;font-family:ui-monospace,monospace;font-size:.88vw;line-height:1.4;text-align:left;color:var(--ink);border-top:1px solid var(--line);padding-top:.5vh;white-space:nowrap;overflow:hidden}.pfoot .k{color:var(--dim);display:inline-block;width:7.5em}.pfoot .g{color:var(--glue)}
</style>
<style>
@media print{@page{size:1280px 720px;margin:0}}
.printmode{overflow:visible!important;height:auto!important}
.printmode #deck,.printmode .deck{position:static!important;height:auto!important}
.printmode .slide{position:relative!important;inset:auto!important;display:flex!important;width:1280px!important;height:720px!important;break-after:page;page-break-after:always;overflow:hidden}
.printmode .frag{opacity:0!important}
.printmode .frag.show{opacity:1!important}
.printmode #pg{display:none}
</style>
</head>
<body>
<div id="deck"></div><div id="pg"></div>
<script>
// ---- jedna konzistentní postavička (role v orchestraci, model jako bytost) ----
function mascot(o={}){o={face:'happy',spine:true,say:'',prompt:'',props:'',scale:1,senior:false,frontier:false,hat:'',...o};
 const HATS={refiner:'<path d="M44 30 q46 -46 92 0 Z" fill="#fff" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/><path d="M136 30 l30 -2 q-10 -12 -30 -10" fill="#fff" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>',reviewer:'<path d="M52 30 q38 -48 76 0 Z" fill="#fff" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/><rect x="28" y="24" width="124" height="10" rx="5" fill="#fff" stroke="var(--ink)" stroke-width="4"/>',senior:'<rect x="56" y="-22" width="68" height="50" rx="4" fill="#fff" stroke="var(--ink)" stroke-width="4"/><rect x="34" y="22" width="112" height="10" rx="5" fill="#fff" stroke="var(--ink)" stroke-width="4"/><rect x="58" y="8" width="64" height="8" fill="var(--ink)"/>'};
 const eyes={happy:'<circle class="eye" cx="72" cy="86" r="8"/><circle class="eye" cx="108" cy="86" r="8"/>',
  surprised:'<circle class="win2" cx="72" cy="86" r="11" fill="#fff"/><circle class="win2" cx="108" cy="86" r="11" fill="#fff"/>',
  confused:'<path class="fl" d="M62 84 l20 -6"/><circle class="eye" cx="108" cy="86" r="8"/>',
  sleepy:'<path class="fl" d="M62 86 q10 8 20 0"/><path class="fl" d="M98 86 q10 8 20 0"/>'}[o.face]||'';
 const mouth={happy:'<path class="fl" d="M68 112 q22 18 44 0"/>',surprised:'<circle class="fl" cx="90" cy="116" r="9"/>',
  confused:'<path class="fl" d="M74 114 l26 4"/>',sleepy:'<path class="fl" d="M74 116 q16 -8 32 0"/>'}[o.face]||'';
 const P={gauge:'<circle cx="150" cy="150" r="20" fill="#fff" stroke="var(--ink)" stroke-width="4"/><line x1="150" y1="150" x2="163" y2="137" stroke="var(--steer)" stroke-width="5"/>'};
 let extra='';o.props.split(',').forEach(p=>{if(P[p])extra+=P[p]});
 const say=o.say?`<g transform="translate(${o.hat?132:112},${o.hat?-64:-20})"><rect x="0" y="0" rx="11" width="${30+o.say.length*24}" height="70" fill="#fff" stroke="var(--ink)" stroke-width="4"/><text x="22" y="49" font-size="46" fill="var(--ink)">${o.say}</text><path d="M36 70 l-18 36 l42 -36" fill="#fff" stroke="var(--ink)" stroke-width="4"/></g>`:'';
 return `<svg class="masc m-${o.frontier?'frontier':o.senior?'senior':'ours'}" viewBox="-20 -36 220 326" style="height:${o.scale*40*(o.senior?1.45:1)}vh;overflow:visible">
  ${o.senior?'<rect class="body" x="14" y="28" width="152" height="232" rx="24"/>':'<rect class="body" x="30" y="40" width="120" height="220" rx="16"/>'}
  <rect class="win2" x="48" y="150" width="34" height="38"/><rect class="win2" x="98" y="150" width="34" height="38"/>
  <rect class="win2" x="48" y="200" width="34" height="38"/><rect class="win2" x="98" y="200" width="34" height="38"/>
  ${eyes}${mouth}${o.senior?'<rect x="52" y="72" width="38" height="30" rx="7" fill="none" stroke="var(--dim)" stroke-width="3.5"/><rect x="92" y="72" width="38" height="30" rx="7" fill="none" stroke="var(--dim)" stroke-width="3.5"/><line x1="90" y1="86" x2="92" y2="86" stroke="var(--dim)" stroke-width="3.5"/><path d="M64 106 q10 11 26 5 q16 6 26 -5" fill="none" stroke="var(--dim)" stroke-width="5.5" stroke-linecap="round"/><circle cx="64" cy="106" r="2.5" fill="var(--dim)"/><circle cx="116" cy="106" r="2.5" fill="var(--dim)"/>':''}
  ${o.frontier?'<path class="crown" d="M56 40 L64 10 L80 30 L90 6 L100 30 L116 10 L124 40 Z" fill="var(--other)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/><circle cx="64" cy="10" r="3.6" fill="var(--other)" stroke="var(--ink)" stroke-width="2"/><circle cx="90" cy="6" r="3.6" fill="var(--other)" stroke="var(--ink)" stroke-width="2"/><circle cx="116" cy="10" r="3.6" fill="var(--other)" stroke="var(--ink)" stroke-width="2"/>':o.hat?(HATS[o.hat]||''):'<line class="fl" x1="90" y1="40" x2="90" y2="24"/><circle class="eye" cx="90" cy="20" r="5"/>'}
  <line class="fl" x1="30" y1="150" x2="6" y2="120"/><line class="fl" x1="150" y1="150" x2="174" y2="120"/>
  <line class="fl" x1="66" y1="260" x2="66" y2="286"/><line class="fl" x1="114" y1="260" x2="114" y2="286"/>${extra}${say}</svg>`;}
// Franta naživo: ikonka autíčka + povel, který mu mezi řečí nadiktuju do telefonu (web auta diakritiku sám odstraní); každý ověřený na cs6q
function franta(cmds,pos='left:2vw;top:2.5vh'){const c=[].concat(cmds);return `<div style="position:absolute;${pos};display:flex;align-items:center;gap:.7vw;z-index:5"><svg viewBox="0 0 64 40" style="width:4.2vw;overflow:visible"><path d="M15 17 L21 6 H43 L49 17Z" fill="var(--over)" opacity=".85"/><rect x="3" y="16" width="58" height="14" rx="4" fill="var(--over)"/><rect x="24" y="8" width="16" height="7.5" rx="1.5" fill="#fff"/><circle cx="29" cy="11.8" r="1.4" fill="var(--ink)"/><circle cx="35" cy="11.8" r="1.4" fill="var(--ink)"/><line x1="49" y1="9" x2="57" y2="1" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="32" r="6.5" fill="var(--ink)"/><circle cx="48" cy="32" r="6.5" fill="var(--ink)"/></svg><div class="col" style="gap:.35vh;align-items:flex-start">${c.map(x=>`<div class="tb" style="font-size:1.05vw;padding:.35em .75em"><span class="r">Franto ▸</span> ${x}</div>`).join('')}</div></div>`}
// teploměr: kde figuruje teplota (T 0..5 → hladina; studená modrá, horká červená)
function thermo(T,h='2.8em'){const f=Math.min(T/5,1),lv=2+f*24,col=T<0.5?'#3d7fd9':T<1.5?'var(--steer)':'var(--over)';return `<svg viewBox="0 0 16 42" style="height:${h};vertical-align:middle;margin:0 .15em;overflow:visible"><rect x="4.5" y="1.5" width="7" height="31" rx="3.5" fill="#fff" stroke="var(--ink)" stroke-width="1.6"/><circle cx="8" cy="34.5" r="6" fill="${col}" stroke="var(--ink)" stroke-width="1.6"/><rect x="6.3" y="${30-lv}" width="3.4" height="${lv+3}" fill="${col}"/>${[8,14,20,26].map(y=>`<line x1="11.5" y1="${y}" x2="14" y2="${y}" stroke="var(--ink)" stroke-width="1"/>`).join('')}</svg>`}
// odkazy na papery: malý řádek vpravo dole na slidu
function cite(...it){return `<div class="cite">${it.map(([t,u])=>`${t} · <a href="${u.startsWith('http')?u:'https://arxiv.org/abs/'+u}" target="_blank">${u.startsWith('http')?u.replace(/^https?:\/\//,'').replace(/\/index.html$/,''):'arxiv.org/abs/'+u}</a>`).join('<br>')}</div>`}
function chipMascot(o={}){o={scale:.3,say:'',...o};
 const say=o.say?`<g transform="translate(150,-30)"><rect x="0" y="0" rx="9" width="${26+o.say.length*18}" height="52" fill="#fff" stroke="var(--ink)" stroke-width="3.5"/><text x="14" y="36" font-size="34" fill="var(--ink)">${o.say}</text><path d="M24 52 l-12 26 l30 -26" fill="#fff" stroke="var(--ink)" stroke-width="3.5"/></g>`:'';
 let legs='';for(const y of [46,62,78,94]){legs+=`<line class="fl" x1="44" y1="${y}" x2="18" y2="${y}"/><line class="fl" x1="156" y1="${y}" x2="182" y2="${y}"/>`;}
 return `<svg class="masc m-ours" viewBox="0 -24 200 150" style="height:${o.scale*40}vh;overflow:visible"><rect class="body" x="44" y="30" width="112" height="80" rx="12"/>${legs}<line class="fl" x1="100" y1="30" x2="100" y2="12"/><circle class="eye" cx="100" cy="8" r="5"/><circle class="eye" cx="80" cy="60" r="7"/><circle class="eye" cx="120" cy="60" r="7"/><path class="fl" d="M78 84 q22 16 44 0"/><rect class="win2" x="62" y="96" width="14" height="8"/><rect class="win2" x="124" y="96" width="14" height="8"/>${say}</svg>`;}
function eye(scale=.5,col='var(--steer)'){return `<svg viewBox="0 0 140 92" style="height:${scale*40}vh;overflow:visible"><ellipse cx="70" cy="46" rx="62" ry="34" fill="none" stroke="${col}" stroke-width="5"/><circle cx="70" cy="46" r="20" fill="${col}"/><circle cx="78" cy="39" r="6" fill="#fff"/><path d="M6 46 Q70 2 134 46" fill="none" stroke="${col}" stroke-width="3" opacity=".45"/><path d="M6 46 Q70 90 134 46" fill="none" stroke="${col}" stroke-width="3" opacity=".45"/></svg>`;}
function hacker(scale=.4,say=''){const bub=say?`<g transform="translate(104,-8)"><rect x="0" y="0" rx="10" width="${34+say.length*13}" height="46" fill="#fff" stroke="var(--ink)" stroke-width="3.5"/><text x="16" y="31" font-size="26" fill="var(--ink)">${say}</text><path d="M20 46 l-14 26 l30 -26" fill="#fff" stroke="var(--ink)" stroke-width="3.5"/></g>`:'';return `<svg viewBox="-10 -14 190 214" style="height:${scale*40}vh;overflow:visible"><path d="M18 200 Q18 66 80 44 Q142 66 142 200 Z" fill="var(--ink)"/><ellipse cx="80" cy="118" rx="48" ry="56" fill="#20233a"/><path d="M50 110 l28 11" stroke="var(--over)" stroke-width="8" stroke-linecap="round"/><path d="M110 110 l-28 11" stroke="var(--over)" stroke-width="8" stroke-linecap="round"/>${bub}</svg>`;}

// ---- STEJNÝ model pořád dokola: věž 28 vrstev, červená značka = KDE přesně je hlava/neuron ----
// mk = {layer:0..27, col:0..1 (vlevo→vpravo přes šířku), label, note} nebo null
function modelSVG(mk, h='56vh', say='', ablate=0, nums=false){
 const Y=l=>280-(l/27)*220, CX=c=>58+(c)*104;
 let inside='';
 for(let i=0;i<28;i++){const y=Y(i);
   for(let hh=0;hh<12;hh++){const off=ablate&&HRANK[i]&&HRANK[i][hh]<ablate;inside+=`<rect x="${56+hh*3.6}" y="${y-2.6}" width="2.6" height="5.2" rx="0.7" fill="${off?'var(--dim)':'rgba(130,87,214,0.42)'}"/>`;}
   inside+=`<rect x="110" y="${y-2.4}" width="48" height="4.8" rx="1" fill="rgba(30,44,92,0.13)"/>`;}
 let mark='';
 if(mk&&mk.frame){const y=Y(mk.layer);mark+=`<rect x="50" y="${y-7}" width="112" height="14" rx="3" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-dasharray="4 3"/><text x="166" y="${y+4}" font-size="11" font-weight="700" fill="var(--ink)">vrstva ${mk.layer}</text>`;}
 if(mk&&mk.marks){const y=Y(mk.layer);mk.marks.forEach(m=>{const cx=CX(m.col);mark+=`<circle cx="${cx}" cy="${y}" r="5.5" fill="none" stroke="${m.color}" stroke-width="2.6"/>`;});}
 if(mk&&!mk.frame&&!mk.marks&&!mk.loop){const y=Y(mk.layer), cx=CX(mk.col); const col=mk.color||(mk.steer?'var(--steer)':'var(--over)');
  const glyph=mk.steer?`<path d="M${cx-36} ${y} L${cx-11} ${y}" stroke="${col}" stroke-width="3.5"/><path d="M${cx-11} ${y} l-8 -5 v10 z" fill="${col}"/><circle cx="${cx}" cy="${y}" r="10" fill="var(--paper)" stroke="${col}" stroke-width="3"/><text x="${cx}" y="${y+5.5}" font-size="16" font-weight="800" fill="${col}" text-anchor="middle">+</text>`:`<circle cx="${cx}" cy="${y}" r="10" fill="none" stroke="${col}" stroke-width="3"/><circle cx="${cx}" cy="${y}" r="3.2" fill="${col}"/>`;
  mark=`${glyph}<line x1="${cx+11}" y1="${y}" x2="176" y2="${y}" stroke="${col}" stroke-width="1.5"/>${mk.out&&!mk.chips?`<text x="176" y="${y-30}" font-size="11" fill="${col}">${mk.label} · ${mk.note||''}</text>`:mk.out?``:`<text x="180" y="${y-3}" font-size="12" fill="${col}">${mk.label}</text>${mk.note?`<text x="180" y="${y+13}" font-size="10" fill="var(--dim)">${mk.note}</text>`:''}`}`;}
 const bubble=say?`<g transform="translate(144,4)"><rect x="0" y="0" rx="6" width="${16+say.length*7}" height="23" fill="#fff" stroke="var(--ink)" stroke-width="2.5"/><text x="8" y="16" font-size="13" fill="var(--ink)">${say}</text></g>`:'';
 return `<svg viewBox="-4 ${mk&&mk.loop?-36:0} ${mk&&mk.chips?590:mk&&(mk.callouts||mk.out||mk.loop)?470:320} ${mk&&mk.loop?380:mk&&mk.dict?388:344}" style="height:${h}">
   <defs><marker id="jm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="var(--you)"/></marker></defs>
   <line x1="106" y1="30" x2="106" y2="16" stroke="var(--ink)" stroke-width="2.5"/><circle cx="106" cy="13" r="3" fill="var(--ink)"/>
   <rect x="52" y="30" width="108" height="252" rx="16" fill="var(--paper)" stroke="var(--ink)" stroke-width="7"/>
   ${(()=>{const m=(mk&&mk.mood)||'happy';
     const eyes={happy:'<circle class="eye" cx="92" cy="45" r="3.6" fill="var(--ink)"/><circle class="eye" cx="120" cy="45" r="3.6" fill="var(--ink)"/>',

const sl=[...document.querySelectorAll('.slide')];let si=0,fi=0;
const frags=()=>[...sl[si].querySelectorAll('.frag')];

const nsteps=()=>{const s=seqs();return s.length?s.length-1:frags().length;};
function drawArcs(root){root.querySelectorAll('.arcbox').forEach(box=>{box.querySelectorAll('svg.arc').forEach(e=>e.remove());const f=box.querySelector('.arc-from'),t=box.querySelector('.arc-to');if(!f||!t||!box.offsetParent)return;const b=box.getBoundingClientRect(),fr=f.getBoundingClientRect(),tr=t.getBoundingClientRect();const fx=fr.left+fr.width/2-b.left,fy=fr.top-b.top,tx=tr.left+tr.width/2-b.left,ty=tr.bottom-b.top;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','arc');svg.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none';const d=(fy-ty)*0.55;svg.innerHTML=`<defs><marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--attn)"/></marker></defs><path d="M${fx} ${fy-2} C ${fx} ${fy-d}, ${tx} ${ty+d}, ${tx} ${ty+3}" fill="none" stroke="var(--attn)" stroke-width="3" marker-end="url(#am)"/><text x="${(fx+tx)/2+10}" y="${(fy+ty)/2}" font-size="${b.width*0.012}" font-weight="700" fill="var(--attn)">0,46</text>`;box.appendChild(svg);});}
function render(){
  sl.forEach((s,i)=>s.classList.toggle('on',i===si));
  frags().forEach((f,i)=>f.classList.toggle('show',i<fi));
  const s=seqs();if(s.length){const cur=Math.min(fi,s.length-1);s.forEach((e,i)=>e.classList.toggle('on',i===cur));}
  requestAnimationFrame(()=>drawArcs(sl[si]));
  document.getElementById('pg').textContent=(si+1)+' / '+sl.length;
}
function next(){if(fi<nsteps())fi++;else if(si<sl.length-1){si++;fi=0}render()}
function prev(){if(fi>0)fi--;else if(si>0){si--;fi=nsteps()}render()}
addEventListener('resize',()=>drawArcs(sl[si]));

 function oled(prog){const c=document.createElement('canvas');c.width=256;c.height=128;c.style.cssText='width:28vw;border-radius:6px;display:block;background:#000';
  const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,256,128);g.scale(2,2);g.strokeStyle=g.fillStyle='#5fe3ff';g.lineWidth=1;g.font='8px monospace';g.textBaseline='top';let drew=0;
  for(const raw of prog.split('\n')){if(/^\s/.test(raw))continue;const m=raw.match(/^(\w+)\((.*)\)\s*$/);if(!m)continue;const f=m[1];

 function act(p){const o=[];const t=(r,w)=>{if(r.test(p))o.push(w)};t(/move\(/,'jede');t(/arm\(/,'mává rukou');t(/tone\(|beep\(/,'pípá');t(/while /,'hlídá ve smyčce');t(/circle\(|line\(|rect\(|fill\(|text\(/,'píše na displej');return o.join(' · ')}

  const pre=document.createElement('pre');pre.className='tb';pre.style.cssText='font-size:.85vw;margin:.6vh 0 0;max-height:22vh;overflow:hidden';pre.textContent=prog.split('\n').slice(0,10).join('\n');box.append(pre);
  box.style.display='block';clearTimeout(hideT);hideT=setTimeout(()=>box.style.display='none',9000)}
 box.onclick=e=>{e.stopPropagation();box.style.display='none'};
 async function poll(){try{const r=await fetch('/franta',{cache:'no-store'});if(r.ok){const j=await r.json();if(j.n!==undefined){if(n0===null)n0=j.n;else if(j.n!==n0){n0=j.n;show(j)}}}}catch(e){}setTimeout(poll,700)}
